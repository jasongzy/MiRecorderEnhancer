name: Android

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: mirecorderenhancer
  APP_DISPLAY_NAME: Mi Recorder Enhancer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ github.workspace }}/release.jks
      ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/^VERSION_NAME=//p' gradle.properties)"
          test -n "$version_name"
          test "$GITHUB_REF_NAME" = "$version_name"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS"
          test -n "$ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_RELEASE_STORE_FILE"
      - name: Build signed release
        run: ./gradlew --no-daemon :app:lintRelease :app:assembleRelease
      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          output="${APP_NAME}-${GITHUB_REF_NAME}.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          cp "$apk" "$output"
          sha256sum "$output" > "${output}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}
          path: |
            ${{ env.APP_NAME }}-${{ github.ref_name }}.apk
            ${{ env.APP_NAME }}-${{ github.ref_name }}.apk.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${APP_NAME}-${GITHUB_REF_NAME}.apk"
          "${APP_NAME}-${GITHUB_REF_NAME}.apk.sha256"
          --verify-tag
          --generate-notes
          --title "${APP_DISPLAY_NAME} ${GITHUB_REF_NAME}"
